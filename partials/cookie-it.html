<div id="cookie-banner" class="cookie-banner">
    <button type="button" id="close-cookie-banner" class="cookie-close" aria-label="Chiudi e continua con i soli cookie tecnici" title="Chiudi e continua con i soli cookie tecnici">&times;</button>
    <div class="cookie-content">
      <p>
        Usiamo cookie tecnici, necessari al funzionamento e alla sicurezza del sito, e, solo con il tuo consenso, i cookie statistici di Google Analytics.
        Con «Rifiuta» restano attivi soltanto quelli tecnici. Per saperne di più, consulta la
        <a href="cookie-policy.html" target="_blank" rel="noopener noreferrer">Cookie Policy</a>.
      </p>
    </div>
    <div class="cookie-buttons">
      <button type="button" id="accept-cookies" class="btn-cookie">Accetta tutti</button>
      <button type="button" id="reject-cookies" class="btn-cookie btn-secondary">Rifiuta</button>
      <button type="button" id="manage-cookies" class="btn-cookie btn-secondary">Gestisci cookie</button>
    </div>
  </div>

  <div id="cookie-preferences" class="hidden" role="dialog" aria-modal="true" aria-labelledby="cookie-prefs-title">
    <h2 id="cookie-prefs-title">Preferenze Cookie</h2>
    <form>
      <label>
        <input type="checkbox" name="cookieType" value="analitici" />
        Cookie analitici (Google Analytics)
      </label>
      <button id="save-preferences" type="button">Salva preferenze</button>
      <button type="submit" style="display:none" aria-hidden="true"></button>
    </form>
  </div>
